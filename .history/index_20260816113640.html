<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotional Romantic Lyrics Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
        }

        /* --- HEART STYLING (Same Size, Intense Blink) --- */
        .heart {
            position: absolute;
            color: #ff0000;
            font-size: 24px; 
            z-index: 0;
        }

        /* 1. Left & Right Side - Bahut Zyada Chamkila & Fast Blink */
        .heart-left {
            animation: pulse-intense 1s infinite ease-in-out;
        }
        .heart-right {
            /* Speed halki si alag taki ek sath na chamkein (natural lage) */
            animation: pulse-intense 1.2s infinite ease-in-out;
        }
        @keyframes pulse-intense {
            0% { transform: scale(1); text-shadow: 0 0 10px red; opacity: 0.2; }
            /* Ekdum jor se chamakna */
            50% { transform: scale(1.3); text-shadow: 0 0 30px red, 0 0 60px red, 0 0 100px #ff3333; opacity: 1; }
            100% { transform: scale(1); text-shadow: 0 0 10px red; opacity: 0.2; }
        }

        /* 2. Center - Thoda zyada noticeable aur fast blink */
        .heart-center {
            animation: pulse-center 1.4s infinite ease-in-out;
        }
        @keyframes pulse-center {
            0% { transform: scale(1); text-shadow: 0 0 5px red; opacity: 0.2; }
            50% { transform: scale(1.2); text-shadow: 0 0 20px red, 0 0 50px red; opacity: 0.9; }
            100% { transform: scale(1); text-shadow: 0 0 5px red; opacity: 0.2; }
        }
        /* -------------------------- */

        /* Top Photo Slider Section */
        #photo-container {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 35vh;
            z-index: 1;
            display: none;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 0, 50, 0.3);
        }
        #slider-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            transition: opacity 1s ease-in-out; 
            opacity: 1;
        }

        /* Movie Credits Style Lyrics Area */
        #lyrics-area {
            position: absolute;
            bottom: 5vh;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 50vh;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            text-align: center;
            
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 100%);
        }

        .line {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffffff;
            text-shadow: 0 0 15px #ff79c6, 0 0 30px #ff79c6;
            transition: transform 3s ease-in, opacity 2.5s ease-in;
            opacity: 1;
            position: absolute;
            bottom: 10%;
        }

        .scroll-up {
            transform: translateY(-25vh);
            opacity: 0;
        }

        #playBtn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 40px;
            font-size: 22px;
            background-color: #aa0000;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px #aa0000;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="hearts-bg"></div>

    <div id="photo-container">
        <img id="slider-image" src="photo1.jpg" alt="Romantic Moments">
    </div>

    <div id="lyrics-area"></div>

    <button id="playBtn">❤️ Play Experience</button>

    <script>
        const heartsBg = document.getElementById('hearts-bg');

        function createHearts(className, count, minLeft, maxLeft) {
            for(let i=0; i<count; i++) {
                let heart = document.createElement('div');
                heart.className = `heart ${className}`;
                heart.innerHTML = '❤';
                let leftPos = Math.random() * (maxLeft - minLeft) + minLeft;
                heart.style.left = leftPos + 'vw';
                heart.style.top = Math.random() * 95 + 'vh'; 
                heart.style.animationDelay = Math.random() * 2 + 's'; // Timing adjust ki taaki jaldi start ho
                heartsBg.appendChild(heart);
            }
        }

        // Left me 35 chamkile aur fast blinking hearts
        createHearts('heart-left', 35, 0, 25);
        
        // Right me 35 chamkile aur fast blinking hearts
        createHearts('heart-right', 35, 75, 98);
        
        // Center me ab 30 hearts hain (Pehle 15 the)
        createHearts('heart-center', 30, 30, 70);

        const images = [
            'photo1.jpg', 
            'photo 2.jpg', 
            'photo 3.jpg', 
            'photo 4.jpg', 
            'photo 5.jpeg', 
            'photo 6.jpg'
        ]; 
        
        let imgIndex = 0;
        const sliderImg = document.getElementById('slider-image');
        let sliderInterval; 

        function startImageSlider() {
            document.getElementById('photo-container').style.display = 'flex';
            clearInterval(sliderInterval);
            
            sliderInterval = setInterval(() => {
                sliderImg.style.opacity = 0; 
                setTimeout(() => {
                    imgIndex = (imgIndex + 1) % images.length;
                    sliderImg.src = images[imgIndex]; 
                    sliderImg.style.opacity = 1; 
                }, 1000); 
            }, 3500); 
        }

        const lyricsText = [
           "Teri nazaron ka dil pe hua hai asar",
            "Tu mera mehboob hai jaana",
            "Teri ulfat mein jeeta har pal",
            "Tu ek tohfa hai khuda ka",
            "Tujhe paake jawaab mila hai asar",
            
            
            "Tu hai woh sawaal Khuda ka",
            "Tu mila hai, yeh meri dua ka asar",
            "Tu mujhse door na jaana",

            "Teri nazron ka dil pe hua hai asar",
            "Tu mera mehboob hai jaana",
             "Teri ulfat mein jeeta har pal",
             "Tu ik tohfa hai khuda ka"

        ];
        
        const audio = new Audio('EHSAAS.mp3'); 

        audio.addEventListener('ended', function() {
            clearInterval(sliderInterval); 
            const btn = document.getElementById('playBtn');
            btn.innerHTML = '🔄 Play Again'; 
            btn.style.display = 'block'; 
        });

        document.getElementById('playBtn').addEventListener('click', async function() {
            this.style.display = 'none'; 
            
            audio.currentTime = 0; 
            audio.play(); 
            startImageSlider(); 

            const lyricsArea = document.getElementById('lyrics-area');
            lyricsArea.innerHTML = ''; 

            for(let i=0; i<lyricsText.length; i++) {
                let lineDiv = document.createElement('div');
                lineDiv.className = 'line';
                lyricsArea.innerHTML = '';
                lyricsArea.appendChild(lineDiv);

                let lineStr = lyricsText[i];
                for(let j=0; j<lineStr.length; j++) {
                    lineDiv.innerHTML += lineStr[j];
                    await new Promise(r => setTimeout(r, 60)); 
                }

                await new Promise(r => setTimeout(r, 500)); 
                lineDiv.classList.add('scroll-up'); 
                await new Promise(r => setTimeout(r, 1000)); 
            }
        });
    </script>
</body>
</html>
