<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Emotional Romantic Lyrics Animation</title>

    <style>

        /* =====================================================
           GLOBAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000000;
        }

        body {
            color: white;
            font-family: 'Courier New', Courier, monospace;

            overflow: hidden;

            min-height: 100vh;
            min-height: 100dvh;

            position: relative;
        }


        /* =====================================================
           HEART BACKGROUND
        ===================================================== */

        #hearts-bg {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .heart {
            position: absolute;

            color: #ff0000;

            font-size: 24px;

            z-index: 0;

            will-change: transform, opacity;
        }


        .heart-left,
        .heart-right {
            animation:
                pulse-intense
                1.2s
                infinite
                ease-in-out;
        }


        .heart-center {
            animation:
                pulse-center
                1.5s
                infinite
                ease-in-out;
        }


        @keyframes pulse-intense {

            0% {
                transform: scale(1);
                text-shadow: 0 0 6px red;
                opacity: 0.2;
            }

            50% {
                transform: scale(1.25);

                text-shadow:
                    0 0 12px red,
                    0 0 22px red;

                opacity: 0.9;
            }

            100% {
                transform: scale(1);
                text-shadow: 0 0 6px red;
                opacity: 0.2;
            }
        }


        @keyframes pulse-center {

            0% {
                transform: scale(1);
                text-shadow: 0 0 4px red;
                opacity: 0.2;
            }

            50% {
                transform: scale(1.18);

                text-shadow:
                    0 0 10px red,
                    0 0 20px red;

                opacity: 0.8;
            }

            100% {
                transform: scale(1);
                text-shadow: 0 0 4px red;
                opacity: 0.2;
            }
        }


        /* =====================================================
           PHOTO CONTAINER
        ===================================================== */

        #photo-container {
            position: absolute;

            top: 4%;
            left: 50%;

            transform: translateX(-50%);

            width: 100%;

            height: 51vh;
            height: 51dvh;

            z-index: 1;

            display: none;

            justify-content: center;
            align-items: center;

            padding: 10px;

            overflow: hidden;
        }


        /* =====================================================
           SMOOTH PHOTO CROSS FADE
        ===================================================== */

        #slider-image-1,
        #slider-image-2 {
            position: absolute;

            display: block;

            max-width: min(85%, 800px);
            max-height: 100%;

            width: auto;
            height: auto;

            object-fit: contain;

            border-radius: 15px;

            box-shadow:
                0 0 18px rgba(255, 0, 50, 0.30);

            opacity: 0;

            transition:
                opacity 1.5s ease-in-out;

            will-change: opacity;
        }


        #slider-image-1 {
            opacity: 1;
        }


        #slider-image-2 {
            opacity: 0;
        }


        /* =====================================================
           LYRICS AREA
        ===================================================== */

        #lyrics-area {
            position: absolute;

            bottom: 2vh;
            bottom: 2dvh;

            left: 50%;

            transform: translateX(-50%);

            width: min(85%, 1100px);

            height: 35vh;
            height: 35dvh;

            z-index: 2;

            display: flex;

            flex-direction: column;

            justify-content: flex-end;

            align-items: center;

            text-align: center;

            -webkit-mask-image:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    black 25%,
                    black 100%
                );

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    black 25%,
                    black 100%
                );

            pointer-events: none;
        }


        /* =====================================================
           LYRICS TEXT
           EACH WORD = DIFFERENT COLOUR
        ===================================================== */

        .line {
            width: 100%;

            font-size:
                clamp(
                    22px,
                    2.4vw,
                    32px
                );

            line-height: 1.4;

            font-weight: bold;

            margin-bottom: 20px;

            padding: 0 12px;

            color: #ffffff;

            /*
                Clean shadow only.
                No heavy blur.
            */

            text-shadow:
                0 1px 2px rgba(0, 0, 0, 0.9);

            transition:
                transform 3s ease-in,
                opacity 2.5s ease-in;

            opacity: 1;

            position: absolute;

            bottom: 10%;

            overflow-wrap: break-word;

            -webkit-font-smoothing: antialiased;

            text-rendering: optimizeLegibility;
        }


        /* =====================================================
           WORD
        ===================================================== */

        .word {
            display: inline-block;

            font-weight: bold;

            /*
                Small clean glow matching
                the word colour.
            */

            text-shadow:
                0 0 3px currentColor,
                0 1px 2px rgba(0, 0, 0, 0.9);
        }


        /* =====================================================
           NAME CHARACTER
           EACH ALPHABET = DIFFERENT COLOUR
        ===================================================== */

        .name-char {
            display: inline-block;

            font-weight: bold;

            text-shadow:
                0 0 3px currentColor,
                0 1px 2px rgba(0, 0, 0, 0.9);
        }


        /* =====================================================
           SCROLL UP
        ===================================================== */

        .scroll-up {
            transform: translateY(-25vh);
            opacity: 0;
        }


        /* =====================================================
           WELCOME SCREEN
        ===================================================== */

        #welcome-screen {
            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width:
                min(90%, 520px);

            text-align: center;

            z-index: 15;

            background:
                rgba(15, 0, 0, 0.88);

            padding:
                clamp(
                    22px,
                    5vw,
                    40px
                );

            border-radius: 15px;

            box-shadow:
                0 0 25px
                rgba(255, 0, 50, 0.25);

            border:
                1px solid #aa0000;

            backdrop-filter: blur(5px);
        }


        #welcome-screen h2 {
            color: #ff79c6;

            text-shadow:
                0 0 5px #ff79c6,
                0 0 12px #ff1493;

            margin:
                0 0 25px;

            font-size:
                clamp(
                    18px,
                    4vw,
                    24px
                );

            line-height: 1.4;
        }


        /* =====================================================
           NAME INPUT
        ===================================================== */

        #userName {
            display: block;

            width:
                min(100%, 380px);

            margin:
                0 auto 22px;

            padding:
                12px 18px;

            font-size:
                clamp(
                    16px,
                    4vw,
                    20px
                );

            border-radius: 10px;

            border:
                2px solid #ff3333;

            background: #000000;

            color: white;

            outline: none;

            text-align: center;

            font-family:
                'Courier New',
                Courier,
                monospace;

            box-shadow:
                0 0 12px
                rgba(255, 0, 50, 0.25);
        }


        #userName:focus {
            box-shadow:
                0 0 8px #ff3333,
                0 0 18px #ff3333;
        }


        /* =====================================================
           BUTTON
        ===================================================== */

        .action-btn {
            padding:
                13px 28px;

            min-height: 48px;

            font-size:
                clamp(
                    16px,
                    4vw,
                    22px
                );

            background-color:
                #aa0000;

            color: white;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            box-shadow:
                0 0 15px #aa0000;

            z-index: 10;

            font-family:
                'Courier New',
                Courier,
                monospace;

            font-weight: bold;

            touch-action:
                manipulation;

            transition:
                background-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }


        .action-btn:hover {
            background-color:
                #ff0000;

            box-shadow:
                0 0 20px #ff0000;
        }


        .action-btn:active {
            transform:
                scale(0.96);
        }


        /* =====================================================
           PLAY AGAIN
        ===================================================== */

        #playAgainBtn {
            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            display: none;

            white-space: nowrap;
        }


        /* =====================================================
           STICKY NAME
        ===================================================== */

        #sticky-name {
            position: absolute;

            top: 57vh;
            top: 57dvh;

            left: 50%;

            transform:
                translateX(-50%);

            width: 90%;

            text-align: center;

            font-size:
                clamp(
                    24px,
                    4.5vw,
                    38px
                );

            color: #ffffff;

            z-index: 20;

            display: none;

            font-weight: bold;

            letter-spacing:
                clamp(
                    1px,
                    0.5vw,
                    3px
                );

            font-style: italic;

            overflow-wrap: break-word;

            -webkit-font-smoothing:
                antialiased;
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (
            min-width: 601px
        )
        and (
            max-width: 1024px
        ) {

            #photo-container {
                top: 5%;

                height: 48dvh;
            }


            #slider-image-1,
            #slider-image-2 {
                max-width: 80%;
            }


            #lyrics-area {
                width: 90%;

                height: 38dvh;
            }


            .line {
                font-size:
                    clamp(
                        22px,
                        3vw,
                        30px
                    );
            }


            #sticky-name {
                top: 55dvh;

                font-size:
                    clamp(
                        24px,
                        4vw,
                        34px
                    );
            }


            .heart {
                font-size: 22px;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {
                min-height:
                    100dvh;
            }


            .heart {
                font-size: 17px;
            }


            /* PHOTO */

            #photo-container {
                top: 3%;

                height: 46dvh;

                padding: 8px;
            }


            #slider-image-1,
            #slider-image-2 {
                max-width: 90%;

                max-height: 100%;

                border-radius: 12px;

                box-shadow:
                    0 0 12px
                    rgba(255, 0, 50, 0.25);
            }


            /* NAME */

            #sticky-name {
                top: 51dvh;

                font-size:
                    clamp(
                        22px,
                        6vw,
                        30px
                    );

                width: 92%;
            }


            /* LYRICS */

            #lyrics-area {
                bottom: 2dvh;

                width: 94%;

                height: 35dvh;
            }


            .line {
                font-size:
                    clamp(
                        18px,
                        5.5vw,
                        24px
                    );

                line-height: 1.4;

                padding:
                    0 5px;

                margin-bottom: 12px;

                text-shadow:
                    0 1px 2px
                    rgba(0, 0, 0, 0.9);
            }


            .word {
                text-shadow:
                    0 0 2px currentColor,
                    0 1px 2px
                    rgba(0, 0, 0, 0.9);
            }


            .name-char {
                text-shadow:
                    0 0 2px currentColor,
                    0 1px 2px
                    rgba(0, 0, 0, 0.9);
            }


            .scroll-up {
                transform:
                    translateY(-22dvh);
            }


            /* WELCOME */

            #welcome-screen {
                width: 90%;

                padding:
                    25px 18px;

                border-radius: 13px;
            }


            #welcome-screen h2 {
                font-size: 18px;

                margin-bottom: 22px;
            }


            #userName {
                width: 100%;

                font-size: 17px;

                padding: 12px;
            }


            .action-btn {
                width: auto;

                max-width: 100%;

                padding:
                    12px 20px;

                font-size: 17px;
            }


            #playAgainBtn {
                width: auto;
            }
        }


        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 380px) {

            #photo-container {
                height: 43dvh;
            }


            #sticky-name {
                top: 49dvh;

                font-size: 21px;
            }


            #lyrics-area {
                height: 38dvh;
            }


            .line {
                font-size: 17px;
            }


            #welcome-screen {
                padding:
                    20px 14px;
            }


            #welcome-screen h2 {
                font-size: 16px;
            }


            .action-btn {
                font-size: 15px;

                padding:
                    11px 16px;
            }
        }


        /* =====================================================
           LANDSCAPE MOBILE
        ===================================================== */

        @media (
            max-height: 500px
        )
        and (
            orientation: landscape
        ) {

            #photo-container {
                top: 2dvh;

                height: 55dvh;
            }


            #slider-image-1,
            #slider-image-2 {
                max-height: 100%;

                max-width: 45%;
            }


            #sticky-name {
                top: 57dvh;

                font-size: 20px;
            }


            #lyrics-area {
                bottom: 1dvh;

                height: 34dvh;

                width: 90%;
            }


            .line {
                font-size: 18px;

                margin-bottom: 8px;
            }


            #welcome-screen {
                width: 70%;

                padding: 15px;
            }


            #welcome-screen h2 {
                font-size: 15px;

                margin-bottom: 10px;
            }


            #userName {
                padding: 8px;

                margin-bottom: 10px;
            }


            .action-btn {
                min-height: 40px;

                padding:
                    8px 18px;

                font-size: 15px;
            }
        }


        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (
            prefers-reduced-motion: reduce
        ) {

            .heart,
            .heart-left,
            .heart-right,
            .heart-center {
                animation-duration: 3s;
            }


            #slider-image-1,
            #slider-image-2,
            .line {
                transition-duration:
                    0.5s;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEART BACKGROUND
    ===================================================== -->

    <div id="hearts-bg"></div>


    <!-- =====================================================
         STICKY NAME
    ===================================================== -->

    <div id="sticky-name"></div>


    <!-- =====================================================
         WELCOME SCREEN
    ===================================================== -->

    <div id="welcome-screen">

        <h2>
            Please enter your name to play and feel this romantic song ✨
        </h2>


        <input
            type="text"
            id="userName"
            placeholder="Your Name..."
            autocomplete="off"
            maxlength="30"
        >


        <button
            id="startBtn"
            class="action-btn"
        >
            ❤️ Enter & Play
        </button>

    </div>


    <!-- =====================================================
         PLAY AGAIN
    ===================================================== -->

    <button
        id="playAgainBtn"
        class="action-btn"
    >
        🔄 Play Again
    </button>


    <!-- =====================================================
         PHOTO SLIDER
    ===================================================== -->

    <div id="photo-container">

        <img
            id="slider-image-1"
            src="photo 1.jpg"
            alt="Romantic Moments"
        >


        <img
            id="slider-image-2"
            src="photo 2.jpeg"
            alt="Romantic Moments"
        >

    </div>


    <!-- =====================================================
         LYRICS
    ===================================================== -->

    <div id="lyrics-area"></div>


    <script>


        /* =====================================================
           HEARTS
        ===================================================== */

        const heartsBg =
            document.getElementById(
                'hearts-bg'
            );


        function createHearts(
            className,
            count,
            minLeft,
            maxLeft
        ) {

            const fragment =
                document.createDocumentFragment();


            for (
                let i = 0;
                i < count;
                i++
            ) {

                const heart =
                    document.createElement(
                        'div'
                    );


                heart.className =
                    `heart ${className}`;


                heart.textContent =
                    '❤';


                const leftPos =
                    Math.random() *
                    (
                        maxLeft -
                        minLeft
                    ) +
                    minLeft;


                heart.style.left =
                    leftPos + 'vw';


                heart.style.top =
                    Math.random() *
                    95 +
                    'vh';


                heart.style.animationDelay =
                    Math.random() *
                    2 +
                    's';


                fragment.appendChild(
                    heart
                );
            }


            heartsBg.appendChild(
                fragment
            );
        }


        function generateResponsiveHearts() {

            const width =
                window.innerWidth;


            heartsBg.innerHTML =
                '';


            if (width <= 600) {

                createHearts(
                    'heart-left',
                    12,
                    0,
                    25
                );


                createHearts(
                    'heart-right',
                    12,
                    75,
                    98
                );


                createHearts(
                    'heart-center',
                    16,
                    30,
                    70
                );

            }

            else if (width <= 1024) {

                createHearts(
                    'heart-left',
                    20,
                    0,
                    25
                );


                createHearts(
                    'heart-right',
                    20,
                    75,
                    98
                );


                createHearts(
                    'heart-center',
                    20,
                    30,
                    70
                );

            }

            else {

                createHearts(
                    'heart-left',
                    35,
                    0,
                    25
                );


                createHearts(
                    'heart-right',
                    35,
                    75,
                    98
                );


                createHearts(
                    'heart-center',
                    30,
                    30,
                    70
                );
            }
        }


        generateResponsiveHearts();



        /* =====================================================
           IMAGE SLIDER
           SMOOTH CROSS FADE
           3.5 SECOND INTERVAL
        ===================================================== */

        const images = [

            'photo 1.jpg',

            'photo 2.jpeg',

            'photo 3.jpg',

            'photo 4.jpg',

            'photo 5.jpeg',

            'photo 6.jpg'

        ];


        let imgIndex = 0;


        const sliderImg1 =
            document.getElementById(
                'slider-image-1'
            );


        const sliderImg2 =
            document.getElementById(
                'slider-image-2'
            );


        let sliderInterval;


        let activeImage = 1;


        function startImageSlider() {

            document
                .getElementById(
                    'photo-container'
                )
                .style.display =
                'flex';


            clearInterval(
                sliderInterval
            );


            imgIndex = 0;

            activeImage = 1;


            sliderImg1.src =
                images[0];


            sliderImg2.src =
                images[1];


            sliderImg1.style.opacity =
                '1';


            sliderImg2.style.opacity =
                '0';


            sliderInterval =
                setInterval(
                    () => {

                        const nextIndex =
                            (
                                imgIndex + 1
                            )
                            %
                            images.length;


                        if (
                            activeImage === 1
                        ) {

                            sliderImg2.src =
                                images[
                                    nextIndex
                                ];


                            sliderImg1.style.opacity =
                                '0';


                            sliderImg2.style.opacity =
                                '1';


                            activeImage = 2;

                        }

                        else {

                            sliderImg1.src =
                                images[
                                    nextIndex
                                ];


                            sliderImg2.style.opacity =
                                '0';


                            sliderImg1.style.opacity =
                                '1';


                            activeImage = 1;
                        }


                        imgIndex =
                            nextIndex;

                    },
                    3500
                );
        }



        /* =====================================================
           LYRICS
        ===================================================== */

        const lyricsText = [

            "Teri nazaron ka dil pe hua hai asar",

            "Tu mera mehboob hai jaana",

            "Teri ulfat mein jeeta har pal",

            "Tu ek tohfa hai khuda ka",

            "Tujhe paake jawaab mila hai asar",

            "Tu hai woh sawaal Khuda ka",

            "Tu mila hai, yeh meri dua ka asar",

            "Tu mujhse door na jaana",

            "Teri nazron ka dil pe hua hai asar",

            "Tu mera mehboob hai jaana",

            "Teri ulfat mein jeeta har pal",

            "Tu ik tohfa hai khuda ka"

        ];


        /* =====================================================
           ATTRACTIVE WORD COLOURS
        ===================================================== */

        const lyricColors = [

            "#FF4D6D",  /* Rose */
            "#FFD166",  /* Golden */
            "#06D6A0",  /* Green */
            "#4CC9F0",  /* Sky Blue */
            "#4895EF",  /* Blue */
            "#9B5DE5",  /* Purple */
            "#F15BB5",  /* Pink */
            "#FF6B35",  /* Orange */
            "#00F5D4",  /* Aqua */
            "#FF85A1"   /* Light Pink */

        ];


        /* =====================================================
           AUDIO
        ===================================================== */

        const audio =
            new Audio(
                'EHSAAS.mp3'
            );


        audio.preload =
            'auto';


        audio.addEventListener(
            'ended',
            function () {

                clearInterval(
                    sliderInterval
                );


                document
                    .getElementById(
                        'playAgainBtn'
                    )
                    .style.display =
                    'block';
            }
        );



        /* =====================================================
           WAIT
        ===================================================== */

        function wait(ms) {

            return new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        ms
                    )
            );
        }



        /* =====================================================
           WORD-BY-WORD COLOURFUL TYPEWRITER
        ===================================================== */

        async function typeText(
            element,
            text
        ) {

            /*
                Split the sentence into words.

                Example:

                "Teri nazaron ka dil"

                becomes:

                ["Teri", "nazaron", "ka", "dil"]
            */

            const words =
                text.split(' ');


            for (
                let wordIndex = 0;
                wordIndex < words.length;
                wordIndex++
            ) {

                /*
                    Create one span for
                    the complete word.
                */

                const wordSpan =
                    document.createElement(
                        'span'
                    );


                wordSpan.className =
                    'word';


                /*
                    Each WORD gets one colour.
                */

                const color =
                    lyricColors[
                        wordIndex %
                        lyricColors.length
                    ];


                wordSpan.style.color =
                    color;


                wordSpan.style.textShadow = `
                    0 0 3px ${color},
                    0 1px 2px rgba(0, 0, 0, 0.9)
                `;


                element.appendChild(
                    wordSpan
                );


                /*
                    Type the letters of this
                    word one by one.

                    But ALL letters of the
                    word have the SAME colour.
                */

                for (
                    let char of words[wordIndex]
                ) {

                    wordSpan.textContent +=
                        char;


                    await wait(120);
                }


                /*
                    Add space between words.
                */

                if (
                    wordIndex <
                    words.length - 1
                ) {

                    const space =
                        document.createTextNode(
                            ' '
                        );


                    element.appendChild(
                        space
                    );
                }
            }
        }



        /* =====================================================
           PLAY MAGIC
        ===================================================== */

        async function playMagic() {

            audio.pause();

            audio.currentTime = 0;


            try {

                await audio.play();

            }

            catch (error) {

                console.log(
                    'Audio could not autoplay:',
                    error
                );
            }


            startImageSlider();


            const lyricsArea =
                document.getElementById(
                    'lyrics-area'
                );


            lyricsArea.innerHTML =
                '';


            for (
                let i = 0;
                i < lyricsText.length;
                i++
            ) {

                const lineDiv =
                    document.createElement(
                        'div'
                    );


                lineDiv.className =
                    'line';


                lyricsArea.innerHTML =
                    '';


                lyricsArea.appendChild(
                    lineDiv
                );


                await typeText(
                    lineDiv,
                    lyricsText[i]
                );


                await wait(500);


                lineDiv.classList.add(
                    'scroll-up'
                );


                await wait(1000);
            }
        }



        /* =====================================================
           START BUTTON
        ===================================================== */

        document
            .getElementById(
                'startBtn'
            )
            .addEventListener(
                'click',
                function () {

                    const userNameInput =
                        document
                            .getElementById(
                                'userName'
                            )
                            .value
                            .trim();


                    if (
                        userNameInput === ''
                    ) {

                        alert(
                            'Please enter your name first! ❤️'
                        );


                        return;
                    }


                    document
                        .getElementById(
                            'welcome-screen'
                        )
                        .style.display =
                        'none';


                    const stickyName =
                        document.getElementById(
                            'sticky-name'
                        );


                    /*
                        Clear old name.
                    */

                    stickyName.innerHTML =
                        '';


                    /*
                        Colours specifically
                        for NAME alphabets.
                    */

                    const nameColors = [

                        '#FF4D6D',

                        '#FFD166',

                        '#06D6A0',

                        '#4CC9F0',

                        '#4895EF',

                        '#9B5DE5',

                        '#F15BB5',

                        '#FF6B35',

                        '#00F5D4',

                        '#FF85A1'

                    ];


                    /*
                        Left sparkle
                    */

                    const leftSparkle =
                        document.createElement(
                            'span'
                        );


                    leftSparkle.textContent =
                        '✨ ';


                    stickyName.appendChild(
                        leftSparkle
                    );


                    /*
                        EVERY ALPHABET
                        gets a different colour.
                    */

                    for (
                        let i = 0;
                        i < userNameInput.length;
                        i++
                    ) {

                        const char =
                            userNameInput[i];


                        /*
                            Keep spaces as spaces.
                        */

                        if (
                            char === ' '
                        ) {

                            const space =
                                document.createTextNode(
                                    ' '
                                );


                            stickyName.appendChild(
                                space
                            );


                            continue;
                        }


                        const charSpan =
                            document.createElement(
                                'span'
                            );


                        charSpan.className =
                            'name-char';


                        const color =
                            nameColors[
                                i %
                                nameColors.length
                            ];


                        charSpan.style.color =
                            color;


                        charSpan.style.textShadow = `
                            0 0 3px ${color},
                            0 1px 2px rgba(0, 0, 0, 0.9)
                        `;


                        charSpan.textContent =
                            char;


                        stickyName.appendChild(
                            charSpan
                        );
                    }


                    /*
                        Right sparkle
                    */

                    const rightSparkle =
                        document.createElement(
                            'span'
                        );


                    rightSparkle.textContent =
                        ' ✨';


                    stickyName.appendChild(
                        rightSparkle
                    );


                    stickyName.style.display =
                        'block';


                    playMagic();
                }
            );



        /* =====================================================
           ENTER KEY SUPPORT
        ===================================================== */

        document
            .getElementById(
                'userName'
            )
            .addEventListener(
                'keydown',
                function (event) {

                    if (
                        event.key === 'Enter'
                    ) {

                        document
                            .getElementById(
                                'startBtn'
                            )
                            .click();
                    }
                }
            );



        /* =====================================================
           PLAY AGAIN
        ===================================================== */

        document
            .getElementById(
                'playAgainBtn'
            )
            .addEventListener(
                'click',
                function () {

                    this.style.display =
                        'none';


                    imgIndex = 0;

                    activeImage = 1;


                    sliderImg1.src =
                        images[0];


                    sliderImg2.src =
                        images[1];


                    sliderImg1.style.opacity =
                        '1';


                    sliderImg2.style.opacity =
                        '0';


                    playMagic();
                }
            );



        /* =====================================================
           RESIZE
        ===================================================== */

        let resizeTimer;


        window.addEventListener(
            'resize',
            function () {

                clearTimeout(
                    resizeTimer
                );


                resizeTimer =
                    setTimeout(
                        () => {

                            generateResponsiveHearts();

                        },
                        300
                    );
            }
        );

    </script>

</body>

</html>
